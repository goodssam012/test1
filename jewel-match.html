<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보석 매치</title>
<style>
  :root { --bg1:#1a1035; --bg2:#0b0618; --panel:rgba(255,255,255,.07); --text:#f3eefe; --accent:#ffcf4a; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2)); color:var(--text);
         font-family:system-ui, "Malgun Gothic", sans-serif; display:flex; justify-content:center; padding:16px; }
  .wrap { width:100%; max-width:520px; }
  h1 { text-align:center; margin:4px 0 12px; font-size:30px; letter-spacing:2px;
       background:linear-gradient(90deg,#ff6b6b,#ffd54a,#6bff8a,#6bc8ff,#d77bff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .stat { background:var(--panel); border-radius:12px; padding:8px; text-align:center; }
  .stat small { display:block; opacity:.7; font-size:12px; }
  .stat b { font-size:22px; color:var(--accent); }
  .bar { height:12px; background:var(--panel); border-radius:6px; overflow:hidden; margin-bottom:10px; }
  .bar div { height:100%; width:0; background:linear-gradient(90deg,#7b5cff,#ff5cc8); transition:width .3s; }
  .board { position:relative; }
  canvas { width:100%; aspect-ratio:1; display:block; border-radius:14px; touch-action:none; cursor:pointer;
           background:linear-gradient(160deg,#2a1d55,#140c2c); box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08); }
  .banner { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
            font-size:44px; font-weight:900; color:#fff; text-shadow:0 0 20px #ff5cc8, 0 4px 0 #000; opacity:0; transform:scale(.5); transition:all .35s; }
  .banner.show { opacity:1; transform:scale(1); }
  .buttons { display:flex; gap:8px; margin-top:12px; }
  button { flex:1; padding:12px; border:0; border-radius:12px; font-size:16px; font-weight:700; color:#fff; cursor:pointer;
           background:linear-gradient(180deg,#6a4cff,#4527c9); box-shadow:0 4px 0 #2b1680; }
  button:active { transform:translateY(2px); box-shadow:0 2px 0 #2b1680; }
  .help { text-align:center; opacity:.6; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>💎 보석 매치</h1>
  <div class="stats">
    <div class="stat"><small>점수</small><b id="score">0</b></div>
    <div class="stat"><small>레벨</small><b id="level">1</b></div>
    <div class="stat"><small>최고 점수</small><b id="best">0</b></div>
  </div>
  <div class="bar"><div id="prog"></div></div>
  <div class="board">
    <canvas id="c"></canvas>
    <div class="banner" id="banner"></div>
  </div>
  <div class="buttons">
    <button id="hintBtn">💡 힌트</button>
    <button id="newBtn">🔄 새 게임</button>
    <button id="soundBtn">🔊 소리</button>
  </div>
  <div class="help">보석을 클릭하거나 드래그해서 옆 보석과 바꾸세요. 같은 보석 3개 이상을 한 줄로, 또는 2×2 사각형으로!</div>
</div>

<script>
const N = 8, TYPES = 7, S = 64;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = N * S * dpr; canvas.height = N * S * dpr;
ctx.scale(dpr, dpr);

// ---------- 보석 그리기 ----------
const COLORS = [
  ['#ff8a8a', '#e01828', '#6e0010'], // 빨강
  ['#ffffff', '#cfd3dd', '#737a8a'], // 흰색
  ['#b2e4ff', '#2196ff', '#0a3b94'], // 파랑
  ['#b6ffaa', '#2fc42a', '#0a6012'], // 초록
  ['#fff8aa', '#f5d10c', '#8f7200'], // 노랑
  ['#ffd09a', '#ff7f12', '#9a3a00'], // 주황
  ['#f3b4ff', '#b52fe0', '#55087a'], // 보라
];
function poly(n, r, rot = 0, cy = 0) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = rot + i * Math.PI * 2 / n; p.push([Math.cos(a) * r, Math.sin(a) * r + cy]); }
  return p;
}
function shape(t) {
  switch (t) {
    case 0: { const a = .78, b = .55; return [[-b,-a],[b,-a],[a,-b],[a,b],[b,a],[-b,a],[-a,b],[-a,-b]]; }
    case 1: return poly(10, .84, -Math.PI / 2);
    case 2: return [[-.45,-.72],[.45,-.72],[.88,-.2],[0,.85],[-.88,-.2]];
    case 3: return poly(8, .88, Math.PI / 8);
    case 4: return poly(4, .92, -Math.PI / 2);
    case 5: return poly(6, .9, 0);
    case 6: return poly(3, .98, -Math.PI / 2, .18);
  }
}
function makeSprite(t) {
  const size = 128, c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.translate(size / 2, size / 2); g.scale(size / 2 * .95, size / 2 * .95);
  const [light, mid, dark] = COLORS[t];
  const outer = shape(t);
  const cx = outer.reduce((s, p) => s + p[0], 0) / outer.length;
  const cy = outer.reduce((s, p) => s + p[1], 0) / outer.length;
  const inner = outer.map(([x, y]) => [cx + (x - cx) * .52, cy + (y - cy) * .52 - .04]);
  const path = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };

  // 그림자
  g.save(); g.translate(.04, .07); path(outer); g.fillStyle = 'rgba(0,0,0,.35)'; g.fill(); g.restore();
  // 몸체
  const grad = g.createLinearGradient(-1, -1, 1, 1);
  grad.addColorStop(0, light); grad.addColorStop(.5, mid); grad.addColorStop(1, dark);
  path(outer); g.fillStyle = grad; g.fill();
  // 면(facet) 음영
  for (let i = 0; i < outer.length; i++) {
    const j = (i + 1) % outer.length;
    const mx = (outer[i][0] + outer[j][0]) / 2 - cx, my = (outer[i][1] + outer[j][1]) / 2 - cy;
    const len = Math.hypot(mx, my) || 1;
    const d = (-mx * .7 - my * .7) / len;
    g.beginPath(); g.moveTo(...outer[i]); g.lineTo(...outer[j]); g.lineTo(...inner[j]); g.lineTo(...inner[i]); g.closePath();
    g.fillStyle = d > 0 ? `rgba(255,255,255,${d * .35})` : `rgba(0,0,0,${-d * .35})`;
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = .02; g.stroke();
  }
  // 윗면
  const ig = g.createLinearGradient(-.5, -.5, .5, .5);
  ig.addColorStop(0, light); ig.addColorStop(1, mid);
  path(inner); g.fillStyle = ig; g.fill();
  g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = .025; g.stroke();
  // 테두리
  path(outer); g.strokeStyle = dark; g.lineWidth = .05; g.stroke();
  // 반짝임
  g.beginPath(); g.ellipse(cx - .22, cy - .3, .2, .1, -.6, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,.75)'; g.fill();
  g.beginPath(); g.arc(cx + .25, cy + .25, .05, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,.5)'; g.fill();
  return c;
}
const sprites = Array.from({ length: TYPES }, (_, t) => makeSprite(t));

// ---------- 소리 ----------
let muted = false, actx = null;
function beep(freq, dur = .12, type = 'sine', vol = .12) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

// ---------- 게임 상태 ----------
let grid = [], dying = [], particles = [], floaters = [];
let score = 0, level = 1, levelStart = 0, target = 1000, best = 0;
let busy = false, sel = null, drag = null, hintPair = null, idle = 0;
let settleWaiters = [];
try { best = +localStorage.getItem('jewelBest') || 0; } catch (e) {}

const rand = () => Math.floor(Math.random() * TYPES);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const settle = () => new Promise(r => settleWaiters.push(r));
function newGem(type, r, c, y) { return { type, r, c, x: c, y: y ?? r, vy: 0, scale: 1, slide: false }; }

function makeTypes() {
  let t;
  do {
    t = [];
    for (let r = 0; r < N; r++) {
      t.push([]);
      for (let c = 0; c < N; c++) {
        let v;
        do { v = rand(); } while (
          (c >= 2 && t[r][c - 1] === v && t[r][c - 2] === v) ||
          (r >= 2 && t[r - 1][c] === v && t[r - 2][c] === v) ||
          (r >= 1 && c >= 1 && t[r - 1][c] === v && t[r][c - 1] === v && t[r - 1][c - 1] === v));
        t[r].push(v);
      }
    }
  } while (!findMove(t));
  return t;
}

function matchAt(t, r, c) {
  const v = t[r][c]; let h = 1, w = 1;
  for (let k = c - 1; k >= 0 && t[r][k] === v; k--) h++;
  for (let k = c + 1; k < N && t[r][k] === v; k++) h++;
  for (let k = r - 1; k >= 0 && t[k][c] === v; k--) w++;
  for (let k = r + 1; k < N && t[k][c] === v; k++) w++;
  if (h >= 3 || w >= 3) return true;
  // 이 칸을 포함하는 2x2 사각형 검사
  for (const [dr, dc] of [[0, 0], [0, -1], [-1, 0], [-1, -1]]) {
    const r0 = r + dr, c0 = c + dc;
    if (r0 < 0 || c0 < 0 || r0 + 1 >= N || c0 + 1 >= N) continue;
    if (t[r0][c0] === v && t[r0][c0 + 1] === v && t[r0 + 1][c0] === v && t[r0 + 1][c0 + 1] === v) return true;
  }
  return false;
}
function findMove(t = grid.map(row => row.map(g => g.type))) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const r2 = r + dr, c2 = c + dc;
      if (r2 >= N || c2 >= N) continue;
      [t[r][c], t[r2][c2]] = [t[r2][c2], t[r][c]];
      const ok = matchAt(t, r, c) || matchAt(t, r2, c2);
      [t[r][c], t[r2][c2]] = [t[r2][c2], t[r][c]];
      if (ok) return [{ r, c }, { r: r2, c: c2 }];
    }
  }
  return null;
}

function findMatches() {
  const groups = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const t = grid[r][c].type; let e = c + 1;
      while (e < N && grid[r][e].type === t) e++;
      if (e - c >= 3) groups.push(grid[r].slice(c, e));
      c = e;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const t = grid[r][c].type; let e = r + 1;
      while (e < N && grid[e][c].type === t) e++;
      if (e - r >= 3) { const g = []; for (let k = r; k < e; k++) g.push(grid[k][c]); groups.push(g); }
      r = e;
    }
  }
  // 2x2 사각형
  for (let r = 0; r + 1 < N; r++) for (let c = 0; c + 1 < N; c++) {
    const t = grid[r][c].type;
    if (grid[r][c + 1].type === t && grid[r + 1][c].type === t && grid[r + 1][c + 1].type === t) {
      const g = [grid[r][c], grid[r][c + 1], grid[r + 1][c], grid[r + 1][c + 1]];
      g.square = true;
      groups.push(g);
    }
  }
  const set = new Set();
  groups.forEach(g => g.forEach(x => set.add(x)));
  return { groups, set };
}

function swapCells(a, b) {
  const g1 = grid[a.r][a.c], g2 = grid[b.r][b.c];
  grid[a.r][a.c] = g2; grid[b.r][b.c] = g1;
  [g1.r, g1.c, g2.r, g2.c] = [b.r, b.c, a.r, a.c];
  g1.slide = g2.slide = true;
}

function clearMatches(m, combo) {
  let gained = 0;
  for (const g of m.groups) {
    const base = g.square ? 100 : g.length === 3 ? 30 : g.length === 4 ? 90 : g.length * 50;
    const pts = base * combo * level;
    gained += pts;
    const cx = g.reduce((s, x) => s + x.c, 0) / g.length, cy = g.reduce((s, x) => s + x.r, 0) / g.length;
    floaters.push({ x: (cx + .5) * S, y: (cy + .5) * S, text: (g.square ? '사각형! +' : '+') + pts, life: 1, color: COLORS[g[0].type][0] });
  }
  if (combo > 1) floaters.push({ x: N * S / 2, y: N * S / 2, text: `콤보 x${combo}!`, life: 1.2, color: '#ffcf4a', big: true });
  for (const g of m.set) {
    grid[g.r][g.c] = null;
    g.dying = true;
    dying.push(g);
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
      particles.push({ x: (g.c + .5) * S, y: (g.r + .5) * S, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
                       life: .6 + Math.random() * .3, color: COLORS[g.type][1] });
    }
  }
  addScore(gained);
  beep(520 * Math.pow(1.12, combo - 1), .15, 'triangle');
  setTimeout(() => beep(780 * Math.pow(1.12, combo - 1), .12, 'sine', .08), 60);
}

function gravity() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const g = grid[r][c];
      if (g) { if (r !== w) { grid[w][c] = g; grid[r][c] = null; g.r = w; } w--; }
    }
    const empty = w + 1;
    for (let r = 0; r <= w; r++) grid[r][c] = newGem(rand(), r, c, r - empty - .2);
  }
}

async function doSwap(a, b) {
  busy = true; hintPair = null; idle = 0;
  swapCells(a, b); beep(440, .06);
  await settle();
  let m = findMatches();
  if (!m.set.size) {
    swapCells(a, b); beep(180, .15, 'square', .05);
    await settle();
    busy = false; return;
  }
  let combo = 1;
  while (m.set.size) {
    clearMatches(m, combo);
    await sleep(230);
    gravity();
    await settle();
    m = findMatches(); combo++;
  }
  await checkLevel();
  if (!findMove()) await reshuffle();
  busy = false;
}

async function reshuffle() {
  showBanner('섞는 중...');
  await sleep(500);
  const t = makeTypes();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { grid[r][c].type = t[r][c]; grid[r][c].scale = 0; }
  await sleep(600);
  hideBanner();
}

function addScore(n) {
  score += n;
  if (score > best) { best = score; try { localStorage.setItem('jewelBest', best); } catch (e) {} }
  updateUI();
}
async function checkLevel() {
  if (score < target) return;
  level++; levelStart = target; target = levelStart + 1000 + (level - 1) * 800;
  updateUI();
  showBanner(`레벨 ${level}!`);
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .2, 'triangle', .1), i * 110));
  await sleep(1100);
  hideBanner();
}
function updateUI() {
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('level').textContent = level;
  document.getElementById('best').textContent = best.toLocaleString();
  const p = Math.min(1, (score - levelStart) / (target - levelStart));
  document.getElementById('prog').style.width = (p * 100) + '%';
}
const banner = document.getElementById('banner');
function showBanner(t) { banner.textContent = t; banner.classList.add('show'); }
function hideBanner() { banner.classList.remove('show'); }

function newGame() {
  score = 0; level = 1; levelStart = 0; target = 1000;
  sel = null; hintPair = null; idle = 0; dying = []; particles = []; floaters = [];
  const t = makeTypes();
  grid = t.map((row, r) => row.map((v, c) => newGem(v, r, c, r - N - 1 - c * .3)));
  updateUI();
  busy = true;
  settle().then(() => { busy = false; });
}

// ---------- 입력 ----------
function cellAt(e) {
  const rect = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left) / rect.width * N);
  const r = Math.floor((e.clientY - rect.top) / rect.height * N);
  return r >= 0 && r < N && c >= 0 && c < N ? { r, c } : null;
}
const adjacent = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
canvas.addEventListener('pointerdown', e => {
  if (busy) return;
  const p = cellAt(e); if (!p) return;
  idle = 0;
  if (sel && adjacent(sel, p)) { const a = sel; sel = null; doSwap(a, p); return; }
  sel = (sel && sel.r === p.r && sel.c === p.c) ? null : p;
  drag = { x: e.clientX, y: e.clientY, cell: p };
  beep(660, .04, 'sine', .05);
});
canvas.addEventListener('pointermove', e => {
  if (!drag || busy) return;
  const rect = canvas.getBoundingClientRect();
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, th = rect.width / N * .4;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  const a = drag.cell;
  const b = Math.abs(dx) > Math.abs(dy) ? { r: a.r, c: a.c + Math.sign(dx) } : { r: a.r + Math.sign(dy), c: a.c };
  drag = null;
  if (b.r < 0 || b.r >= N || b.c < 0 || b.c >= N) return;
  sel = null; doSwap(a, b);
});
window.addEventListener('pointerup', () => { drag = null; });
document.getElementById('hintBtn').onclick = () => { if (!busy) { hintPair = findMove(); beep(880, .08); } };
document.getElementById('newBtn').onclick = () => { if (!busy) newGame(); };
document.getElementById('soundBtn').onclick = e => { muted = !muted; e.target.textContent = muted ? '🔇 소리' : '🔊 소리'; };

// ---------- 루프 ----------
function update(dt) {
  let moving = false;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c]; if (!g) continue;
    if (g.slide) {
      const sp = 7 * dt;
      g.x += Math.sign(g.c - g.x) * Math.min(Math.abs(g.c - g.x), sp);
      g.y += Math.sign(g.r - g.y) * Math.min(Math.abs(g.r - g.y), sp);
      if (g.x === g.c && g.y === g.r) g.slide = false; else moving = true;
    } else if (g.y < g.r) {
      g.vy += 45 * dt; g.y += g.vy * dt;
      if (g.y >= g.r) { g.y = g.r; g.vy = 0; } else moving = true;
    }
    if (g.scale < 1) g.scale = Math.min(1, g.scale + dt * 3);
  }
  if (!moving && settleWaiters.length) { const w = settleWaiters; settleWaiters = []; w.forEach(f => f()); }
  dying = dying.filter(g => (g.scale -= dt * 5) > 0);
  particles = particles.filter(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; return p.life > 0; });
  floaters = floaters.filter(f => { f.y -= 40 * dt; f.life -= dt; return f.life > 0; });
  if (!busy) { idle += dt; if (idle > 7 && !hintPair) hintPair = findMove(); }
}

function drawGem(g, extra = 1) {
  const size = S * .88 * g.scale * extra;
  ctx.drawImage(sprites[g.type], g.x * S + S / 2 - size / 2, g.y * S + S / 2 - size / 2, size, size);
}

function render(time) {
  ctx.clearRect(0, 0, N * S, N * S);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.025)';
    ctx.fillRect(c * S, r * S, S, S);
  }
  const pulse = (Math.sin(time / 150) + 1) / 2;
  const ring = (p, color) => {
    ctx.strokeStyle = color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(p.c * S + 3, p.r * S + 3, S - 6, S - 6, 10); ctx.stroke();
  };
  if (hintPair) hintPair.forEach(p => ring(p, `rgba(255,220,80,${.3 + pulse * .7})`));
  if (sel) ring(sel, '#fff');

  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, N * S, N * S); ctx.clip();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const g = grid[r][c]; if (!g) continue;
    const isSel = sel && sel.r === r && sel.c === c && !g.slide;
    drawGem(g, isSel ? 1 + Math.sin(time / 120) * .07 : 1);
  }
  ctx.globalCompositeOperation = 'lighter';
  dying.forEach(g => drawGem(g, 1.3 - g.scale * .3));
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  floaters.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.font = `900 ${f.big ? 40 : 22}px system-ui, sans-serif`;
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.7)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); render(now);
  requestAnimationFrame(loop);
}
newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
